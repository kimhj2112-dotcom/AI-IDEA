<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>슈팅 게임</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            font-family: sans-serif;
        }
        .container {
            display: flex;
            gap: 50px;
            align-items: center;
        }
        .instructions {
            background-color: #34495e;
            padding: 25px;
            border-radius: 10px;
        }
        .game-wrapper {
            text-align: center;
        }
        canvas {
            background-color: #1a252f;
            border: 2px solid #ecf0f1;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        h2 { margin: 0 0 5px 0; }
        p { color: #f1c40f; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 왼쪽 조작 방법 설명 -->
        <div class="instructions">
            <h3>조작 방법</h3>
            <ul style="list-style-type: none; padding: 0; line-height: 2;">
                <li><strong>← / →</strong> : 좌우 이동</li>
                <li><strong>Space</strong> : 미사일 발사</li>
            </ul>
        </div>
        
        <!-- 오른쪽 게임 영역 -->
        <div class="game-wrapper">
            <h2>슈팅 게임</h2>
            <p>점수: <span id="score">0</span></p>
            <canvas id="gameCanvas" width="400" height="500"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        let score = 0;
        let gameOver = false;

        // 플레이어 설정
        const player = {
            x: 175, y: 450, width: 50, height: 30, speed: 5, dx: 0
        };

        const bullets = [];
        const enemies = [];

        function drawPlayer() {
            ctx.fillStyle = '#3498db'; // 파란색 플레이어
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function drawBullets() {
            ctx.fillStyle = '#f1c40f'; // 노란색 총알
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
        }

        function drawEnemies() {
            ctx.fillStyle = '#e74c3c'; // 빨간색 적
            enemies.forEach(enemy => {
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            });
        }

        function update() {
            if (gameOver) return;

            // 플레이어 이동
            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // 총알 이동 및 화면 밖 제거
            for (let i = 0; i < bullets.length; i++) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                    i--;
                }
            }

            // 적 무작위 생성
            if (Math.random() < 0.03) {
                enemies.push({
                    x: Math.random() * (canvas.width - 40),
                    y: -40, width: 40, height: 40, speed: 2 + Math.random() * 2
                });
            }

            // 적 이동 및 충돌 체크
            for (let i = 0; i < enemies.length; i++) {
                enemies[i].y += enemies[i].speed;

                // 적과 플레이어 충돌 (게임 오버)
                if (enemies[i].y + enemies[i].height > player.y &&
                    enemies[i].x < player.x + player.width &&
                    enemies[i].x + enemies[i].width > player.x) {
                    gameOver = true;
                }

                // 화면 밖으로 나간 적 제거
                if (enemies[i] && enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    i--;
                }
            }

            // 총알과 적 충돌 처리
            for (let i = 0; i < enemies.length; i++) {
                for (let j = 0; j < bullets.length; j++) {
                    if (bullets[j] && enemies[i] &&
                        bullets[j].x < enemies[i].x + enemies[i].width &&
                        bullets[j].x + bullets[j].width > enemies[i].x &&
                        bullets[j].y < enemies[i].y + enemies[i].height &&
                        bullets[j].y + bullets[j].height > enemies[i].y) {
                        
                        score += 10;
                        scoreElement.innerText = score;
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        i--;
                        break;
                    }
                }
            }
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            update();
            drawPlayer();
            drawBullets();
            drawEnemies();

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('게임 오버!', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '20px sans-serif';
                ctx.fillText('새로고침(F5)하여 다시 시작', canvas.width / 2, canvas.height / 2 + 20);
                return;
            }
            requestAnimationFrame(loop);
        }

        // 키보드 이벤트 리스너
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') player.dx = -player.speed;
            if (e.key === 'ArrowRight') player.dx = player.speed;
            if (e.key === ' ' && !gameOver) {
                bullets.push({
                    x: player.x + player.width / 2 - 3,
                    y: player.y, width: 6, height: 15, speed: 8
                });
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') player.dx = 0;
        });

        // 게임 루프 시작
        loop();
    </script>
</body>
</html>
